<!-- Motion & Animation System for White Aurora Dreamscape -->
<style>
  @keyframes dreamCloudDrift {
    0% { transform: translate3d(0, 0, 0); }
    50% { transform: translate3d(-30px, -10px, 0); }
    100% { transform: translate3d(0, 0, 0); }
  }
  @keyframes dreamStarTwinkle {
    0%, 100% { opacity: 0.3; transform: scale(0.9); }
    50% { opacity: 0.9; transform: scale(1.1); }
  }

  .reveal-dream {
    opacity: 0;
    transform: translateY(30px);
    transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .reveal-dream.active {
    opacity: 1;
    transform: translateY(0);
  }

  @media (prefers-reduced-motion: reduce) {
    *, ::before, ::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
      scroll-behavior: auto !important;
    }
    .reveal-dream { opacity: 1 !important; transform: none !important; }
    .cloud-hero__video { display: none !important; }
    .cloud-hero__poster { opacity: 1 !important; }
  }
</style>

<script>
document.addEventListener("DOMContentLoaded", () => {
  // 1. Video Hero Setup & Fallback Handling
  document.querySelectorAll("[data-video-hero]").forEach((hero) => {
    const video = hero.querySelector(".cloud-hero__video") || hero.querySelector("video");
    const poster = hero.querySelector(".cloud-hero__poster") || hero.querySelector("img");
    if (!video) return;

    const showVideo = () => {
      hero.classList.add("video-ready");
      hero.classList.remove("video-failed");
    };

    const showPoster = () => {
      hero.classList.remove("video-ready");
      hero.classList.add("video-failed");
      if (poster) {
        poster.hidden = false;
      }
    };

    video.addEventListener("playing", showVideo);
    video.addEventListener("canplay", showVideo);
    video.addEventListener("error", showPoster);
    const source = video.querySelector("source");
    source?.addEventListener("error", showPoster);

    if (video.readyState >= 2) {
      showVideo();
    }

    const playback = video.play();
    if (playback?.catch) {
      playback.catch(showPoster);
    }
  });

  // 2. Scroll Reveals
  const reveals = document.querySelectorAll(".reveal-dream");
  if ("IntersectionObserver" in window) {
    const observer = new IntersectionObserver((entries) => {
      entries.forEach((e) => {
        if (e.isIntersecting) {
          e.target.classList.add("active");
          observer.unobserve(e.target);
        }
      });
    }, { threshold: 0.15 });
    reveals.forEach((r) => observer.observe(r));
  } else {
    reveals.forEach((r) => r.classList.add("active"));
  }
});
</script>
