<!-- Shared Map Partial -->
{% if lead.mapsEmbedUrl %}
<section class="section map-section">
  <div class="container">
    <h2 class="section-title">Visit Our Office / Clinic</h2>
    <div class="map-container">
      <iframe src="{{ lead.mapsEmbedUrl }}" width="100%" height="360" style="border:0;border-radius:16px;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
    </div>
  </div>
</section>
{% endif %}
